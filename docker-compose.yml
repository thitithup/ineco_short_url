version: "3.8"

services:
  short-url-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ineco-short-url-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/short_url.db
      - API_KEY=ineco-secret-key-12345
      - BASE_URL=http://localhost:8000
      - ENVIRONMENT=production
    volumes:
      - short-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  short-data:
    driver: local
